# GitOps: generado desde docker-compose.yml; verificar con scripts/verificar-gitops.mjs.
# Valida antes de levantar:  docker compose config --quiet && docker compose up -d --build
# No publica puertos en el host: Traefik (red externa «web») es la única entrada, con HTTPS.
# PostgreSQL (motor oficial desde 0.4.0). EXACTAMENTE UN perfil en COMPOSE_PROFILES:
#  A) «postgres-dedicado»: base en este stack, en la red «interact-db» (internal: sin salida ni puertos publicados);
#     interact-db-preparar e interact-migrar viven SOLO en esa red.
#  B) «postgres-administrado»: base de un proveedor externo. interact-migrar-administrado usa la red «interact-salida»
#     (con DNS y salida, sin puertos publicados) y DB_SSL=verificado exige cadena + nombre de host (DB_SSL_CA_FILE
#     opcional para una CA propia). La aplicación llega al proveedor por su red «web» (ya con salida).
# La base dedicada NUNCA se conecta a «interact-salida» ni a «web».
# Cada servicio recibe SOLO su credencial: administración (preparar), migraciones (migrar), aplicación.
# Copias de seguridad: docker-compose.respaldo.yml (credencial de solo lectura, almacenamiento independiente).
name: openclass-live

x-endurecido: &endurecido
  init: true
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "3"

services:
  interact-db:
    <<: *endurecido
    profiles: ["postgres-dedicado"]
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    container_name: interact-db
    restart: unless-stopped
    init: false
    user: "70:70"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --data-checksums"
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: UTC
    command: ["postgres", "-c", "max_connections=40", "-c", "password_encryption=scram-sha-256", "-c", "shared_buffers=96MB",
      "-c", "log_connections=on", "-c", "log_disconnections=on", "-c", "log_min_duration_statement=2000"]
    volumes:
      - interact-pgdata:/var/lib/postgresql/data
    tmpfs:
      - /var/run/postgresql:size=1m,uid=70,gid=70,mode=0700
      - /tmp:size=32m,uid=70,gid=70,mode=0700
    shm_size: 128m
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    stop_grace_period: 30s
    networks:
      - interact-db
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  # Una sola vez por despliegue (idempotente): base, esquema y roles con mínimo privilegio.
  interact-db-preparar:
    <<: *endurecido
    profiles: ["postgres-dedicado"]
    image: openclass-live:0.4.0-${LIVE_REVISION:?Full approved Git SHA required}
    pull_policy: never
    restart: "no"
    user: "1000:1000"
    command: ["node", "scripts/preparar-roles.mjs"]
    environment:
      DB_MODO_POSTGRES: dedicado
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
      INTERACT_DB_MIGRATOR_PASSWORD: ${INTERACT_DB_MIGRATOR_PASSWORD:?INTERACT_DB_MIGRATOR_PASSWORD is required}
      INTERACT_DB_APP_PASSWORD: ${INTERACT_DB_APP_PASSWORD:?INTERACT_DB_APP_PASSWORD is required}
      INTERACT_DB_BACKUP_PASSWORD: ${INTERACT_DB_BACKUP_PASSWORD:?INTERACT_DB_BACKUP_PASSWORD is required}
    mem_limit: 128m
    pids_limit: 64
    networks:
      - interact-db
    depends_on:
      interact-db:
        condition: service_healthy

  # Migraciones versionadas con la credencial propietaria del esquema; la aplicación no tiene DDL.
  interact-migrar:
    <<: *endurecido
    profiles: ["postgres-dedicado"]
    image: openclass-live:0.4.0-${LIVE_REVISION:?Full approved Git SHA required}
    pull_policy: never
    restart: "no"
    user: "1000:1000"
    command: ["node", "scripts/migrar.mjs"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
      DB_SSL: ${DB_SSL:-desactivado}
      DB_SSL_CA_FILE: ${DB_SSL_CA_FILE:-}
      DB_CONNECT_WAIT_SECONDS: "60"
    volumes:
      - ${DB_CA_HOST_FILE:-/dev/null}:/etc/interact/db-ca.pem:ro
    mem_limit: 128m
    pids_limit: 64
    networks:
      - interact-db
    depends_on:
      interact-db-preparar:
        condition: service_completed_successfully

  # Modo B: mismas migraciones contra un PostgreSQL administrado, por una red con DNS y salida (sin puertos publicados).
  interact-migrar-administrado:
    <<: *endurecido
    profiles: ["postgres-administrado"]
    image: openclass-live:0.4.0-${LIVE_REVISION:?Full approved Git SHA required}
    pull_policy: never
    restart: "no"
    user: "1000:1000"
    command: ["node", "scripts/migrar.mjs"]
    environment:
      DATABASE_MIGRATION_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
      DB_SSL: ${DB_SSL:-desactivado}
      DB_SSL_CA_FILE: ${DB_SSL_CA_FILE:-}
      DB_CONNECT_WAIT_SECONDS: "60"
    volumes:
      - ${DB_CA_HOST_FILE:-/dev/null}:/etc/interact/db-ca.pem:ro
    mem_limit: 128m
    pids_limit: 64
    networks:
      - interact-salida

  # Modo B, una sola vez: base, esquema y roles en el proveedor con SU cuenta de administración (perfil aparte,
  # no forma parte del arranque normal):  COMPOSE_PROFILES=postgres-preparar-administrado docker compose run --rm interact-db-preparar-administrado
  interact-db-preparar-administrado:
    <<: *endurecido
    profiles: ["postgres-preparar-administrado"]
    image: openclass-live:0.4.0-${LIVE_REVISION:?Full approved Git SHA required}
    pull_policy: never
    restart: "no"
    user: "1000:1000"
    command: ["node", "scripts/preparar-roles.mjs"]
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
      INTERACT_DB_MIGRATOR_PASSWORD: ${INTERACT_DB_MIGRATOR_PASSWORD:?INTERACT_DB_MIGRATOR_PASSWORD is required}
      INTERACT_DB_APP_PASSWORD: ${INTERACT_DB_APP_PASSWORD:?INTERACT_DB_APP_PASSWORD is required}
      INTERACT_DB_BACKUP_PASSWORD: ${INTERACT_DB_BACKUP_PASSWORD:?INTERACT_DB_BACKUP_PASSWORD is required}
      DB_SSL: ${DB_SSL:-desactivado}
      DB_SSL_CA_FILE: ${DB_SSL_CA_FILE:-}
    volumes:
      - ${DB_CA_HOST_FILE:-/dev/null}:/etc/interact/db-ca.pem:ro
    mem_limit: 128m
    pids_limit: 64
    networks:
      - interact-salida

  openclass-live:
    <<: *endurecido
    build:
      context: .
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.version: "0.4.0"
        org.opencontainers.image.revision: ${LIVE_REVISION:?Full approved Git SHA required}
        org.opencontainers.image.source: https://github.com/herrerawilliamh/create-openclass-uniminuto-revealjs
    image: openclass-live:0.4.0-${LIVE_REVISION:?Full approved Git SHA required}
    pull_policy: never
    container_name: openclass-live
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: ${TZ:-America/Bogota}
      APP_URL: ${APP_URL:?APP_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      # Opcional (acceso heredado 0.3.0). Vacío = solo cuentas personales.
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      # Credencial de la APLICACIÓN (solo DML). Nunca la de administración ni la de migraciones.
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL: ${DB_SSL:-desactivado}
      DB_SSL_CA_FILE: ${DB_SSL_CA_FILE:-}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      DB_MIGRATIONS: verificar
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-desactivado}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PRESENTER_ORIGINS: ${PRESENTER_ORIGINS:-http://localhost:8613,http://localhost:8600}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # Sin valor por defecto: en producción el arranque falla si TRUST_PROXY=true y esto está vacío (IP/32 o subred exacta del proxy).
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      TEACHER_SESSION_HOURS: ${TEACHER_SESSION_HOURS:-8}
      ROOM_TTL_MINUTES: ${ROOM_TTL_MINUTES:-180}
      MAX_ROOM_PARTICIPANTS: ${MAX_ROOM_PARTICIPANTS:-150}
      MAX_ROOMS: ${MAX_ROOMS:-20}
    user: "1000:1000"
    volumes:
      - ${DB_CA_HOST_FILE:-/dev/null}:/etc/interact/db-ca.pem:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.50
    pids_limit: 128
    stop_grace_period: 10s
    expose:
      - "3000"
    networks:
      - web
      - interact-db
    depends_on:
      interact-migrar:
        condition: service_completed_successfully
        required: false
      interact-migrar-administrado:
        condition: service_completed_successfully
        required: false
      interact-db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.openclass-live.rule=Host(`${APP_HOST}`)"
      - "traefik.http.routers.openclass-live.entrypoints=websecure"
      - "traefik.http.routers.openclass-live.tls=true"
      - "traefik.http.routers.openclass-live.tls.certresolver=myresolver"
      - "traefik.http.routers.openclass-live.service=openclass-live-svc"
      - "traefik.http.services.openclass-live-svc.loadbalancer.server.port=3000"

volumes:
  interact-pgdata:

networks:
  web:
    external: true
  # Red privada de la base: sin salida a Internet ni puertos publicados; solo los servicios de este stack.
  interact-db:
    internal: true
  # Solo modo B: salida hacia el proveedor administrado (DNS + TLS). Sin puertos publicados; nunca la base dedicada.
  interact-salida: {}
