name: Pruebas del generador (CI)

# CI ordinaria: no publica nada. En main la ejecuta pages.yml antes de desplegar, y release.yml antes de
# preparar la publicación en npm (workflow_call); en ambos casos es condición obligatoria.
on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  stable-startup:
    name: Arranque estable y lanzador CMD (Windows)
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: F13-G en temporales descartables del runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sandbox = Join-Path $env:RUNNER_TEMP ('openclass-f13h-' + [guid]::NewGuid())
          $originalTemp = $env:TEMP
          $originalTmp = $env:TMP
          try {
            foreach ($dir in @('fixtures', 'evidence', 'cache', 'repo/tests', 'repo/template/scripts', 'repo/template/src/plugins')) {
              New-Item -ItemType Directory -Path (Join-Path $sandbox $dir) -Force | Out-Null
            }
            # La suite conserva sus rutas relativas; ninguna fixture queda junto al checkout.
            foreach ($file in @('tests/stable-startup.test.mjs', 'template/Iniciar OpenClass.cmd', 'template/scripts/openclass-start.mjs', 'template/scripts/openclass-version-notice.mjs', 'template/src/plugins/protocolo-live.mjs')) {
              Copy-Item -LiteralPath $file -Destination (Join-Path $sandbox ('repo/' + $file))
            }
            $env:TEMP = Join-Path $sandbox 'cache'
            $env:TMP = $env:TEMP
            node --test --test-concurrency=1 (Join-Path $sandbox 'repo/tests/stable-startup.test.mjs')
            if ($LASTEXITCODE -ne 0) { throw 'F13-G: pruebas fallidas' }
          } finally {
            $env:TEMP = $originalTemp
            $env:TMP = $originalTmp
            # También cierra hijos que pudieran quedar vivos tras un fallo de arranque.
            Get-CimInstance Win32_Process | Where-Object {
              $_.ProcessId -ne $PID -and $_.CommandLine -and $_.CommandLine.Contains($sandbox)
            } | ForEach-Object {
              taskkill.exe /PID $_.ProcessId /T /F 2>$null | Out-Null
            }
            if (Test-Path -LiteralPath $sandbox) {
              Remove-Item -LiteralPath $sandbox -Recurse -Force
            }
          }

  ligeras:
    name: Basales, P2, documentación y seguridad (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.19.0 = mínimo declarado en engines; 22 y 24 = LTS vigentes.
        node: ['20.19.0', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Basales (28)
        run: npm test
      - name: P2 primera secuencia semanal (28)
        run: npm run test:p2
      - name: P3 documentación distribuida (4)
        run: npm run test:docente
      - name: P4 seguridad de publicación (12)
        run: npm run test:seguridad
      - name: Contenido del paquete npm
        run: npm pack --dry-run --json

  paquete:
    # Trazabilidad del tarball: lo genera con npm pack y lo sube como artefacto. No publica nada ni usa secretos.
    name: Evidencia del paquete npm (npm pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # En pull_request, el commit del PR (no el merge sintético): la evidencia corresponde al árbol revisado.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generar el paquete y su evidencia
        env:
          ESPERADO: ${{ github.event.pull_request.head.sha || github.sha }}
          SALIDA: ${{ github.workspace }}/evidencia-paquete
          CONTENIDO: ${{ runner.temp }}/contenido-paquete
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ESPERADO" || { echo "HEAD no es $ESPERADO"; exit 1; }
          test -z "$(git status --porcelain)" || { echo "Árbol de trabajo modificado"; exit 1; }
          mkdir -p "$SALIDA" "$CONTENIDO"
          npm pack --json --pack-destination "$SALIDA" > "$SALIDA/npm-pack.json"
          tar -xzf "$SALIDA/$(node -p "require(process.argv[1])[0].filename" "$SALIDA/npm-pack.json")" -C "$CONTENIDO"
          NPM_VERSION="$(npm --version)" node --input-type=commonjs - <<'JS'
          const fs = require('fs'), path = require('path'), crypto = require('crypto');
          const { execFileSync } = require('child_process');
          const { SALIDA, CONTENIDO, NPM_VERSION, GITHUB_SERVER_URL, GITHUB_REPOSITORY, GITHUB_RUN_ID, GITHUB_STEP_SUMMARY } = process.env;
          const hash = (alg, b) => crypto.createHash(alg).update(b).digest('hex');
          const git = (...a) => execFileSync('git', a, { encoding: 'utf8' }).trim();
          const fallo = (m) => { console.error(m); process.exit(1); };
          const pack = JSON.parse(fs.readFileSync(path.join(SALIDA, 'npm-pack.json'), 'utf8'))[0];
          const base = path.join(CONTENIDO, 'package');
          const listar = (d, p = '') => fs.readdirSync(d, { withFileTypes: true }).flatMap((e) =>
            e.isDirectory() ? listar(path.join(d, e.name), p + e.name + '/') : [p + e.name]);
          const declarados = pack.files.map((f) => f.path).sort(), extraidos = listar(base).sort();
          if (JSON.stringify(declarados) !== JSON.stringify(extraidos)) fallo('npm pack --json no coincide con el contenido del .tgz');
          if (declarados.length !== pack.entryCount) fallo(`entryCount ${pack.entryCount} != ${declarados.length} archivos`);
          const tgz = fs.readFileSync(path.join(SALIDA, pack.filename));
          if (hash('sha1', tgz) !== pack.shasum) fallo('El SHA-1 del .tgz no coincide con npm pack');
          const files = declarados.map((p) => {
            const b = fs.readFileSync(path.join(base, p));
            return { path: p, size: b.length, sha256: hash('sha256', b) };
          });
          const tarball = { filename: pack.filename, size: tgz.length, sha256: hash('sha256', tgz), shasum: pack.shasum, integrity: pack.integrity };
          const manifiesto = {
            name: pack.name, version: pack.version,
            commit: git('rev-parse', 'HEAD'), tree: git('rev-parse', 'HEAD^{tree}'),
            run: `${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}`,
            node: process.version, npm: NPM_VERSION,
            tarball, filesCount: files.length, files,
          };
          fs.writeFileSync(path.join(SALIDA, 'manifiesto.json'), JSON.stringify(manifiesto, null, 2) + '\n');
          fs.writeFileSync(path.join(SALIDA, 'contenido.sha256'), files.map((f) => `${f.sha256}  ${f.path}`).join('\n') + '\n');
          fs.writeFileSync(path.join(SALIDA, `${pack.filename}.sha256`), `${tarball.sha256}  ${pack.filename}\n`);
          const resumen = [`### Paquete ${pack.name}@${pack.version}`, '', `- Commit: \`${manifiesto.commit}\``, `- Tree: \`${manifiesto.tree}\``,
            `- Tarball: \`${pack.filename}\`, ${tarball.size} bytes`, `- SHA-256: \`${tarball.sha256}\``, `- Archivos: ${files.length}`,
            `- Node ${manifiesto.node}, npm ${manifiesto.npm}`, ''].join('\n');
          fs.appendFileSync(GITHUB_STEP_SUMMARY, resumen);
          console.log(resumen);
          JS
      - name: Subir evidencia del paquete
        uses: actions/upload-artifact@v4
        with:
          name: paquete-npm-${{ github.event.pull_request.head.sha || github.sha }}
          path: evidencia-paquete
          if-no-files-found: error
          retention-days: 90

  navegador:
    name: Chrome real (DOM, portal, navegador, sitio)
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /${{ github.event.repository.name }}/
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # scripts/lib/chrome.mjs usa el WebSocket global (Node >= 22).
          node-version: '22'
      - name: P2 portada en el DOM (8, suite completa)
        run: npm run test:dom
        env:
          OPENCLASS_EVIDENCIA: ${{ github.workspace }}/evidencia/dom
      - name: P3 portal académico (7)
        run: npm run test:portal
        env:
          OPENCLASS_EVIDENCIA: ${{ github.workspace }}/evidencia/portal
      - name: Navegador (11)
        run: npm run test:navegador
      - name: Construir el sitio de GitHub Pages
        run: npm run site:build
      - name: Sitio de GitHub Pages
        run: npm run test:sitio
      - name: Evidencia de fallos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidencia-navegador
          path: evidencia
          if-no-files-found: ignore
