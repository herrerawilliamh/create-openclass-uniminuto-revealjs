name: Interact 0.4.3 manifest evidence (temporary, read-only)
on:
  push:
    branches:
      - feat/interact-043-cierre-visual-20261112
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifest:
    name: Generate deterministic release manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.1'
      - name: Deterministic package from approved payload
        shell: bash
        run: |
          set -euo pipefail
          cd services/openclass-live
          node scripts/empaquetar-despliegue.mjs
          node scripts/generar-manifiesto.mjs 561765012cd40a92003313440c6d23da6df9556b
          test -s releases/0.4.3.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interact-manifest-0.4.3
          path: services/openclass-live/releases/0.4.3.json
          retention-days: 3
          if-no-files-found: error
