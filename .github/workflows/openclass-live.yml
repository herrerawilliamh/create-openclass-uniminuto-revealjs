name: OpenClass Live

# Contrato: services/openclass-live/docs/PUBLICACION-CI-0.3.0.md y AUTOSYNC-PROVENANCE.md.
# Cadena: checks (sin credenciales) -> build único -> aprobación humana -> publish (única escritura).
# Auditoría estática: node services/openclass-live/scripts/publicacion-ci.mjs workflow

on:
  pull_request:
    branches: [main, release/openclass-live]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Etiqueta aprobada e inmutable (openclass-live-v0.3.0); ejecutar el workflow DESDE esa tag'
        required: true
        default: openclass-live-v0.3.0
        type: string

permissions:
  contents: read

concurrency:
  group: live-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Live release checks
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
    # PostgreSQL REAL para las suites (motor oficial desde 0.4.0): misma versión y digest que el Compose.
    # Credencial sintética, solo para este runner efímero; no es un secreto.
    services:
      postgres:
        image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
        env:
          POSTGRES_USER: interact_ci
          POSTGRES_PASSWORD: synthetic-ci-only-postgres-password
          POSTGRES_DB: interact_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U interact_ci -d interact_ci_test"
          --health-interval 5s --health-timeout 5s --health-retries 30
    env:
      INTERACT_TEST_DATABASE_URL: postgres://interact_ci:synthetic-ci-only-postgres-password@127.0.0.1:5432/interact_ci_test
      INTERACT_TEST_REQUIRE_PG_TOOLS: '1'
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: Registrar SHA probado
        id: identity
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Identidad de promoción manual (tag = checkout = HEAD = rama de release)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node services/openclass-live/scripts/publicacion-ci.mjs identidad
      - name: Dependencias del auditor (yaml fijado por lockfile)
        run: npm ci --prefix services/openclass-live --ignore-scripts --no-audit --no-fund
      - name: Contrato del workflow
        run: node services/openclass-live/scripts/publicacion-ci.mjs workflow
      - name: Payload aprobado, lockfile y Compose
        run: node services/openclass-live/scripts/verificar-gitops.mjs
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Cliente PostgreSQL 16 (pg_dump/pg_restore para la prueba de restauración)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client-16
          "$PG_BIN/pg_dump" --version
          "$PG_BIN/pg_isready" -h 127.0.0.1 -p 5432 -U interact_ci -d interact_ci_test
      - name: Pruebas unitarias, integración, PostgreSQL, respaldo/restauración y preparación
        run: npm --prefix services/openclass-live test
      # Gate OBLIGATORIO de Interact (PR): redes/PostgreSQL dedicado y administrado simulado (DNS+TLS), migración y
      # respaldo en ambos modos, cabeceras falsificadas, límites por IP y ausencia de puertos publicados. En secuencia;
      # falla si Docker no está, si se omite una prueba o si cae una aserción. Recursos sintéticos con prefijo propio.
      - name: Integración Docker obligatoria (redes, PostgreSQL administrado simulado, proxy y límites por IP)
        run: node services/openclass-live/scripts/exigir-docker.mjs
      - name: Instalar y comprobar extractor PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          command -v pdftotext
          pdftotext -v
      - name: Navegador, privacidad y protocolo
        run: npm --prefix services/openclass-live run test:navegador
      - name: Validar Compose GitOps (sin construir)
        env:
          APP_URL: https://live.example.invalid
          APP_HOST: live.example.invalid
          SESSION_SECRET: synthetic-ci-only-secret-with-more-than-32-characters
          ADMIN_PASSWORD_HASH: synthetic-ci-compose-validation-only
          LIVE_REVISION: ${{ steps.identity.outputs.sha }}
          COMPOSE_PROFILES: postgres-dedicado
          POSTGRES_ADMIN_PASSWORD: synthetic-ci-compose-admin
          INTERACT_DB_MIGRATOR_PASSWORD: synthetic-ci-compose-migrator-value
          INTERACT_DB_APP_PASSWORD: synthetic-ci-compose-app-value-xxxxx
          INTERACT_DB_BACKUP_PASSWORD: synthetic-ci-compose-backup-value-xx
          DATABASE_ADMIN_URL: postgres://postgres:synthetic@interact-db:5432/postgres
          DATABASE_MIGRATION_URL: postgres://interact_migrador:synthetic@interact-db:5432/interact
          DATABASE_URL: postgres://interact_app:synthetic@interact-db:5432/interact
          DATABASE_BACKUP_URL: postgres://interact_respaldo:synthetic@interact-db:5432/interact
          BACKUP_HOST_DIR: /tmp/interact-respaldos-ci
        run: |
          docker compose -f services/openclass-live/docker-compose.gitops.yml config --quiet
          docker compose -f services/openclass-live/docker-compose.yml -f services/openclass-live/docker-compose.respaldo.yml --profile respaldo config --quiet

  build:
    name: Live build único (OCI)
    if: github.event_name == 'workflow_dispatch'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      manifest_digest: ${{ steps.lock.outputs.manifest_digest }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: Instalar Skopeo
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          command -v skopeo
          skopeo --version
      - name: El commit construido es el commit probado
        env:
          TESTED_SHA: ${{ needs.checks.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$TESTED_SHA" && test "$GITHUB_SHA" = "$TESTED_SHA"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          driver-opts: image=moby/buildkit@sha256:ddd1ca44b21eda906e81ab14a3d467fa6c39cd73b9a39df1196210edcb8db59e # v0.23.2
      - name: Construir una sola vez desde el commit (git archive; base Node fijada por digest)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./services/openclass-live/package.json').version")
          mkdir -p "$RUNNER_TEMP/ctx"
          git archive "$GITHUB_SHA" services/openclass-live | tar -x -C "$RUNNER_TEMP/ctx"
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct "$GITHUB_SHA") docker buildx build \
            --platform linux/amd64 --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$GITHUB_SHA")" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --output "type=oci,dest=$RUNNER_TEMP/image.oci.tar,rewrite-timestamp=true" \
            "$RUNNER_TEMP/ctx/services/openclass-live"
      - name: Lock, verificación OCI offline y humo del mismo artefacto
        id: lock
        shell: bash
        env:
          SYNTHETIC_SECRET: synthetic-ci-only-secret-with-more-than-32-characters
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/layout" live-build
          tar -xf "$RUNNER_TEMP/image.oci.tar" -C "$RUNNER_TEMP/layout"
          node services/openclass-live/scripts/publicacion-ci.mjs lock \
            --layout "$RUNNER_TEMP/layout" --archive "$RUNNER_TEMP/image.oci.tar" --out live-build/release-lock.json
          node services/openclass-live/scripts/publicacion-ci.mjs layout \
            --layout "$RUNNER_TEMP/layout" --lock live-build/release-lock.json
          echo "manifest_digest=$(node -p "require('./live-build/release-lock.json').manifestDigest")" >> "$GITHUB_OUTPUT"
          # Humo sobre los bytes construidos (no sobre una reconstrucción).
          SMOKE_HASH=$(printf '%s' 'synthetic-ci-smoke-only' | node services/openclass-live/scripts/hash-password.mjs)
          skopeo copy "oci-archive:$RUNNER_TEMP/image.oci.tar" "docker-daemon:openclass-live-smoke:temp"
          ID=$(docker images -q openclass-live-smoke:temp)
          test -n "$ID"
          # Humo con PostgreSQL real: el mismo artefacto aplica las migraciones y arranca en modo producción (verificar).
          docker network create live-smoke-net
          docker run -d --name live-smoke-db --network live-smoke-net -e POSTGRES_PASSWORD=synthetic-ci-smoke-postgres \
            postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
          for i in $(seq 1 30); do
            docker exec live-smoke-db pg_isready -q -U postgres && break
            test "$i" -lt 30; sleep 2
          done
          SMOKE_DB=postgres://postgres:synthetic-ci-smoke-postgres@live-smoke-db:5432/postgres
          docker run --rm --network live-smoke-net --read-only --cap-drop ALL -e DATABASE_MIGRATION_URL="$SMOKE_DB" "$ID" node scripts/migrar.mjs
          docker run -d --name live-smoke --network live-smoke-net --read-only --tmpfs /tmp --cap-drop ALL \
            -e APP_URL=https://live.example.invalid -e SESSION_SECRET="$SYNTHETIC_SECRET" \
            -e ADMIN_PASSWORD_HASH="$SMOKE_HASH" -e DATABASE_URL="$SMOKE_DB" "$ID"
          for i in $(seq 1 20); do
            docker exec live-smoke node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && break
            test "$i" -lt 20; sleep 2
          done
          docker rm -f live-smoke live-smoke-db
          docker network rm live-smoke-net
          cp "$RUNNER_TEMP/image.oci.tar" live-build/image.oci.tar
          cp "services/openclass-live/releases/$(node -p "require('./services/openclass-live/package.json').version").json" live-build/payload.json
          printf '%s\n' "$GITHUB_SHA" > live-build/source-commit.txt
          (cd live-build && sha256sum image.oci.tar release-lock.json payload.json source-commit.txt > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openclass-live-build-${{ github.sha }}
          path: live-build/
          retention-days: 14
          if-no-files-found: error

  approval:
    name: Live aprobación humana
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-24.04
    environment: openclass-live-release
    permissions: {}
    steps:
      - name: Esperar aprobación del revisor requerido
        run: echo "Aprobado el digest ${{ needs.build.outputs.manifest_digest }} del commit ${{ github.sha }}. No se reconstruye."

  publish:
    name: Live publicar en GHCR y atestiguar
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/openclass-live-v')
    needs: [build, approval]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.1'
      - name: Identidad vigente al publicar
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: node services/openclass-live/scripts/publicacion-ci.mjs identidad
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: openclass-live-build-${{ github.sha }}
          path: live-build
      - name: Bytes aprobados (hash del tar, lock y layout) sin reconstruir
        shell: bash
        run: |
          set -euo pipefail
          S=services/openclass-live/scripts/publicacion-ci.mjs
          (cd live-build && sha256sum --check SHA256SUMS)
          test "$(cat live-build/source-commit.txt)" = "$GITHUB_SHA"
          test "$(node -p "require('./live-build/release-lock.json').manifestDigest")" = "${{ needs.build.outputs.manifest_digest }}"
          node $S bytes --lock live-build/release-lock.json --archive live-build/image.oci.tar
          mkdir -p "$RUNNER_TEMP/built"
          tar -xf live-build/image.oci.tar -C "$RUNNER_TEMP/built"
          node $S layout --layout "$RUNNER_TEMP/built" --lock live-build/release-lock.json
      - name: Iniciar sesión en GHCR (credenciales Docker; el token no se imprime)
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publicar los mismos bytes en GHCR (digest conservado)
        id: push
        shell: bash
        run: |
          set -euo pipefail
          S=services/openclass-live/scripts/publicacion-ci.mjs
          command -v skopeo
          IMAGE=$(node -p "require('./live-build/release-lock.json').imageRepository")
          DIGEST=$(node -p "require('./live-build/release-lock.json').manifestDigest")
          # Credenciales: las aporta docker/login-action (~/.docker/config.json), que skopeo y la attestation leen.
          # La tag es un alias informativo; la autoridad es siempre el digest.
          skopeo copy --preserve-digests "oci:$RUNNER_TEMP/built" "docker://$IMAGE:sha-$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/published"
          skopeo copy "docker://$IMAGE@$DIGEST" "oci:$RUNNER_TEMP/published"
          node $S layout --layout "$RUNNER_TEMP/published" --lock live-build/release-lock.json
          node $S mismos --a "$RUNNER_TEMP/built" --b "$RUNNER_TEMP/published"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attestation de procedencia del digest publicado
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Compose candidato por digest y sumas
        shell: bash
        run: |
          set -euo pipefail
          mkdir live-release
          cp live-build/release-lock.json live-build/payload.json live-build/source-commit.txt live-release/
          node services/openclass-live/scripts/publicacion-ci.mjs compose \
            --lock live-build/release-lock.json --out live-release/docker-compose.candidate.yml
          (cd live-release && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openclass-live-release-${{ github.sha }}
          path: live-release/
          retention-days: 30
          if-no-files-found: error
